<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TandemTab — track together, save together</title>
    <base href="/" />
    <!-- Quicksand is served from our own origin (the @font-face pair lives at the top of app.css). It was a
         fonts.googleapis.com <link> until 2026-08-30, and the CSP had been refusing it the whole time — see
         the note in app.css. `crossorigin` is not optional on a font preload even for a same-origin file:
         fonts are always fetched in CORS mode, and without it the browser fetches this twice. Only the latin
         subset is preloaded — every user needs it (digits and currency signs live there), while latin-ext is
         a minority of names and is left to the normal unicode-range fetch. -->
    <link rel="preload" href="css/fonts/quicksand-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css?v=47" />
    <link rel="stylesheet" href="FinApp.App.Web.styles.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- Installable web app (OPEN-BETA R2.5). With iOS on hold indefinitely the mobile web IS the iOS
         product, so "add to home screen" is not a nicety here — it is the only way this app becomes an app
         on half the phones that will meet it. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <!-- Seeded to the dark ground because dark is the app's default (see the theme script below); the script
         corrects it for a user who has chosen light, before first paint. -->
    <meta name="theme-color" content="#0f1322" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS reads none of the manifest: the standalone flag, the title and the icon all have to be repeated
         here, and the icon must be a PNG. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TandemTab" />
    <!-- ⚠️ Deliberately `black`, not `black-translucent`. Translucent draws the page under the status bar,
         and nothing in this app pads for `env(safe-area-inset-top)` — the header would sit under the notch. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <script>
        // Apply the saved theme before first paint to avoid a flash. Default is dark (the "Tandem × Midnight"
        // direction) — only an explicit 'light' choice opts out.
        try { if (localStorage.getItem('finapp-theme') !== 'light') document.documentElement.classList.add('dark'); } catch (e) { }
        // The browser chrome around an installed app is painted from <meta name="theme-color">, which is a
        // static tag while this app's theme is a per-device choice. Keep the two in step here and in
        // finappSetTheme, or an installed light-theme app wears a dark title bar for as long as it is open.
        window.finappPaintThemeColor = () => {
            try {
                const tag = document.querySelector('meta[name="theme-color"]');
                if (tag) tag.setAttribute('content', document.documentElement.classList.contains('dark') ? '#0f1322' : '#eef3f0');
            } catch (e) { }
        };
        window.finappPaintThemeColor();
        // ⚠️ Privacy mode used to add a `private` class here, before first paint, so the charts were blurred by CSS
        // the moment the document existed. The charts are no longer covered (numbers only — see app.css), so the
        // class had nothing left to style and is gone. Masking is now entirely FmtCurrency's, which means it
        // begins when Blazor boots; there is nothing to paint before then, because the figures do not exist yet.
    </script>
</head>

<body>

    <div id="app">
        <div style="display:flex;height:100vh;align-items:center;justify-content:center;font-family:sans-serif;color:#555">Loading…</div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        window.finappNavigate = (url) => { window.location.href = url; };
        window.finappScrollIntoView = (id) => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
        window.finappConfirm = (msg) => { try { return window.confirm(msg); } catch (e) { return true; } };
        // A ⋯ row menu opens downward. On a row near the bottom of a list that puts it below the fold, which reads
        // as the menu not opening at all. Flip it above its row when it would overflow — but only when there is
        // actually room up there, or a tall menu on a short screen just swaps one clipped edge for the other.
        // ⚠️ Measure from the ROW, never from the menu's own rect. The menu's position is what this function is
        // about to change, so reading it back conflates "where it is" with "where it would go" — the first cut
        // flipped a menu clean off the top of the screen that way. The row is a fixed anchor: compare the space
        // above and below it against the menu's height, and flip only when down doesn't fit and up does.
        window.finappFitMenus = () => {
            try {
                document.querySelectorAll('.row-menu').forEach(m => {
                    m.classList.remove('menu-up');
                    // Below 560px this menu is already a fixed bottom sheet — it cannot fall below the fold, and
                    // flipping it would fight the sheet's own pinning and throw it off the top of the screen.
                    if (getComputedStyle(m).position === 'fixed') return;
                    const host = m.parentElement;
                    if (!host) return;
                    const h = m.getBoundingClientRect().height;
                    const row = host.getBoundingClientRect();
                    if (window.innerHeight - row.bottom < h + 8 && row.top > h + 8) m.classList.add('menu-up');
                });
            } catch (e) { /* measurement is a nicety; never break a render over it */ }
        };
        // Scrolling changes the answer, and the menu stays open across it.
        window.addEventListener('scroll', () => {
            if (document.querySelector('.row-menu')) window.finappFitMenus();
        }, { passive: true, capture: true });
        window.finappTakeAuthCode = () => {
            try {
                const params = new URLSearchParams(window.location.search);
                const code = params.get('authCode');
                if (code) {
                    params.delete('authCode');
                    const qs = params.toString();
                    history.replaceState(null, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash);
                    return code;
                }
            } catch (e) { }
            return null;
        };
        // ⚠️ The server's OAuth callback redirects to `/?authError=1` when a sign-in fails, and until
        // 2026-08-30 NOTHING read this flag — the user was returned to the landing page with no indication
        // that anything had gone wrong. Read and strip it the same way as the auth code, so a failure says so.
        window.finappTakeAuthError = () => {
            try {
                const params = new URLSearchParams(window.location.search);
                if (params.get('authError')) {
                    params.delete('authError');
                    const qs = params.toString();
                    history.replaceState(null, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash);
                    return true;
                }
            } catch (e) { }
            return false;
        };
        window.finappTakeResetToken = () => {
            try {
                const params = new URLSearchParams(window.location.search);
                const token = params.get('resetToken');
                if (token) {
                    params.delete('resetToken');
                    const qs = params.toString();
                    history.replaceState(null, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash);
                    return token;
                }
            } catch (e) { }
            return null;
        };
        window.finappGetTheme = () => { try { return localStorage.getItem('finapp-theme') || 'dark'; } catch (e) { return 'dark'; } };
        window.finappSetTheme = (theme) => {
            const dark = theme === 'dark';
            document.documentElement.classList.toggle('dark', dark);
            try { localStorage.setItem('finapp-theme', dark ? 'dark' : 'light'); } catch (e) { }
            window.finappPaintThemeColor();
        };
        // Which tab the app opens on (O9). Mirrors the theme preference exactly, and for the same reason: there is
        // no user-settings endpoint and UserDto carries nothing preference-shaped, so a per-device localStorage key
        // is the whole mechanism — no contract, no server, no migration. Unset means "Dashboard", the old fixed one.
        window.finappGetLandingTab = () => { try { return localStorage.getItem('finapp-landing-tab') || ''; } catch (e) { return ''; } };
        window.finappSetLandingTab = (tab) => { try { localStorage.setItem('finapp-landing-tab', tab || ''); } catch (e) { } };
        // Pin a scrolling box to its newest content — the assistant transcript. A chat that leaves you looking at
        // the top of the conversation after an answer arrives is a chat you have to operate.
        // ⚠️ Instant, not smooth: this runs from OnAfterRenderAsync, and a smooth scroll started on one render can
        // still be animating when the next one lands, which lands you between two messages instead of at the end.
        window.finappScrollToEnd = (selector) => {
            try {
                const el = document.querySelector(selector);
                if (el) el.scrollTop = el.scrollHeight;
            } catch (e) { }
        };
        // --- Privacy mode (Ctrl/Cmd+Shift+H) -------------------------------------------------------------
        // JS owns only the SHORTCUT and the persistence; the masking itself is all C# (FmtCurrency). This lives
        // here rather than in Blazor because a document-level keydown is the one thing a component cannot bind
        // without owning focus.
        // ⚠️ The live flag is a VARIABLE that localStorage merely seeds and mirrors — not localStorage itself.
        // The class on <html> used to hold this state; reading the store in its place looks equivalent until the
        // store throws (private browsing, storage disabled), where every read answers false and the shortcut can
        // then only ever turn masking ON. A variable degrades to "works, just doesn't survive a reload".
        let finappPrivate = (() => { try { return localStorage.getItem('finapp-private') === '1'; } catch (e) { return false; } })();
        window.finappIsPrivate = () => finappPrivate;
        // R2.5's auto-mask trigger — the web's answer to the phone's flip-face-down gesture, and deliberately the
        // same design rather than a second one:
        //   • ONE-DIRECTIONAL. Leaving masks; coming back does NOT unmask. Returning to a tab is not evidence that
        //     the person who walked past has gone, and the cost of being wrong is one tap either way. The phone's
        //     comment argues this at length; it is the same argument.
        //   • OPT-IN, off by default. Masking a screen nobody asked to have masked is a bug, not a feature.
        //   • Persisted per device in localStorage, exactly like the mode itself and the landing tab.
        // ⚠️ visibilitychange ONLY — not blur. Blur fires when focus moves to the address bar or devtools, which
        // is not somebody reading over your shoulder; on a laptop that would mask several times a minute and the
        // setting would be off again by lunchtime. Hidden means switched tab, minimised, or screen locked, which
        // is the closest the web has to a phone being turned face-down: a thing the user actually did.
        let finappAutoHide = (() => { try { return localStorage.getItem('finapp-autohide') === '1'; } catch (e) { return false; } })();
        let finappAutoHideExplained = (() => { try { return localStorage.getItem('finapp-autohide-explained') === '1'; } catch (e) { return false; } })();
        window.finappGetAutoHide = () => finappAutoHide;
        window.finappSetAutoHide = (on) => {
            finappAutoHide = !!on;
            try { localStorage.setItem('finapp-autohide', on ? '1' : '0'); } catch (e) { }
        };
        window.finappPrivacy = {
            dotnet: null,
            init(ref) {
                this.dotnet = ref;
                document.removeEventListener('keydown', this.onkey);
                document.addEventListener('keydown', this.onkey);
                document.removeEventListener('visibilitychange', this.onvis);
                document.addEventListener('visibilitychange', this.onvis);
            },
            // Not a method on `this` by accident: addEventListener stores the function, so a body that reached for
            // `this` would be called with `document` as the receiver. Everything here goes through window, the way
            // onkey already does.
            onvis() {
                if (!document.hidden) return;                    // one-directional: only ever ON
                if (!finappAutoHide || window.finappIsPrivate()) return;
                window.finappSetPrivate(true);
                // Say it once, the first time it ever happens. Coming back to a masked screen you did not mask
                // yourself is a bug report waiting to happen, and the fix is one sentence shown once.
                if (!finappAutoHideExplained) {
                    finappAutoHideExplained = true;
                    try { localStorage.setItem('finapp-autohide-explained', '1'); } catch (e) { }
                    const ref = window.finappPrivacy.dotnet;
                    if (ref) ref.invokeMethodAsync('OnAutoMaskedFirstTime');
                }
            },
            onkey(e) {
                if (!e.shiftKey || !(e.ctrlKey || e.metaKey)) return;
                if ((e.key || '').toLowerCase() !== 'h') return;
                // ⚠️ Never while typing, or pressing H in a note toggles the whole UI. Checked on the TARGET
                // rather than on document.activeElement: a keydown inside a contenteditable reports the element,
                // and activeElement can lag behind during composition.
                const t = e.target;
                if (t && (t.isContentEditable || /^(input|textarea|select)$/i.test(t.tagName))) return;
                e.preventDefault();
                window.finappSetPrivate(!window.finappIsPrivate());
            },
        };
        window.finappSetPrivate = (on) => {
            finappPrivate = !!on;
            try { localStorage.setItem('finapp-private', on ? '1' : '0'); } catch (e) { }
            const ref = window.finappPrivacy.dotnet;
            if (ref) ref.invokeMethodAsync('OnPrivacyChanged', !!on);
        };
        // --- R4.5 Trip Mode: the last-good snapshot, kept on the device ------------------------------------
        // The shell has booted offline since S122; what it had was nothing to show, because every read went to
        // the server. This is that half: one row per account holding the snapshot the app last loaded, so an
        // offline start renders real figures instead of an error.
        //
        // ⚠️ IndexedDB rather than localStorage, and the reason is size and blocking: a snapshot is ~260KB of
        // JSON, localStorage is synchronous, and writing that on every account open would jank the main thread
        // on the exact device this feature exists for.
        // ⚠️⚠️ This is ACCOUNT DATA AT REST ON THE DEVICE, in plaintext. Server snapshots are encrypted under
        // KMS; this mirror is not, and that is a privacy-policy surface change owed to R5's legal re-read — the
        // same debt R4's new sub-processor creates. It is written down in OPEN-BETA under R4.5, not implied here.
        // ★ It is cleared on sign-out (finappCache.clear), which is the one mitigation that costs nothing.
        const FINAPP_DB = 'finapp-cache', FINAPP_STORE = 'snapshots';
        let finappDb = null;
        const finappOpenDb = () => finappDb ? Promise.resolve(finappDb) : new Promise((resolve, reject) => {
            let req;
            // A browser with IndexedDB disabled (some private modes) throws on open rather than returning null.
            try { req = indexedDB.open(FINAPP_DB, 1); } catch (e) { reject(e); return; }
            req.onupgradeneeded = () => {
                const db = req.result;
                if (!db.objectStoreNames.contains(FINAPP_STORE)) db.createObjectStore(FINAPP_STORE, { keyPath: 'accountId' });
            };
            req.onsuccess = () => { finappDb = req.result; resolve(finappDb); };
            req.onerror = () => reject(req.error);
        });
        const finappTx = (mode, run) => finappOpenDb().then(db => new Promise((resolve, reject) => {
            const tx = db.transaction(FINAPP_STORE, mode);
            const out = run(tx.objectStore(FINAPP_STORE));
            tx.oncomplete = () => resolve(out && 'result' in out ? out.result : undefined);
            tx.onerror = () => reject(tx.error);
            tx.onabort = () => reject(tx.error);
        }));
        window.finappCache = {
            // ⚠️ Every one of these swallows its failure and answers "no cache". A device that cannot store the
            // snapshot must still run the app online — a caching layer that can break the app it is meant to
            // protect is worse than no caching layer.
            put(accountId, version, payload) {
                return finappTx('readwrite', s => s.put({ accountId, version, payload, at: Date.now() }))
                    .then(() => true).catch(() => false);
            },
            get(accountId) {
                return finappTx('readonly', s => s.get(accountId))
                    .then(r => r ?? null).catch(() => null);
            },
            clear() {
                return finappTx('readwrite', s => s.clear()).then(() => true).catch(() => false);
            },
        };
        window.finappPickImage = () => new Promise(resolve => {
            const input = document.createElement('input');
            input.type = 'file'; input.accept = 'image/*';
            input.onchange = () => {
                const file = input.files && input.files[0];
                if (!file) { resolve(null); return; }
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        const size = 128;
                        const canvas = document.createElement('canvas');
                        canvas.width = size; canvas.height = size;
                        const ctx = canvas.getContext('2d');
                        const scale = Math.max(size / img.width, size / img.height);
                        const w = img.width * scale, h = img.height * scale;
                        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.85));
                    };
                    img.onerror = () => resolve(null);
                    img.src = reader.result;
                };
                reader.onerror = () => resolve(null);
                reader.readAsDataURL(file);
            };
            input.click();
        });
        // Browser Back integration for the single-page dashboard. The app has one route but many "layers"
        // (open modal, chained sub-modal, a non-Home tab). We mirror that layer depth with synthetic history
        // entries so the hardware/browser Back button pops one layer instead of leaving the app. C# owns the
        // truth: it calls sync(depth) after every render, and we make the history stack match.
        window.finappBack = (function () {
            let dotnet = null, depth = 0, suppress = 0;
            function onpop() {
                if (suppress > 0) { suppress--; return; }   // a self-initiated history.go(), not a user Back
                if (depth > 0) {
                    depth--;                                 // this Back consumed one of our trap entries
                    if (dotnet) dotnet.invokeMethodAsync('OnBrowserBack');
                }
                // depth === 0 → nothing of ours to pop; let the browser navigate away as normal.
            }
            return {
                init(ref) { dotnet = ref; window.removeEventListener('popstate', onpop); window.addEventListener('popstate', onpop); },
                // Make the number of trap entries equal `target` (the app's current layer depth).
                sync(target) {
                    if (target > depth) { for (let i = depth; i < target; i++) history.pushState({ finapp: true }, ''); depth = target; }
                    else if (target < depth) { const d = depth - target; suppress += d; depth = target; history.go(-d); }
                }
            };
        })();
        window.finappDownloadFile = (fileName, base64, contentType) => {
            const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
            const blob = new Blob([bytes], { type: contentType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = fileName;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        };
    </script>
    <!--
        Client error reporting, JS side (OPEN-BETA B1). The .NET reporter covers exceptions inside the app; this
        covers the cases it structurally cannot: a failure before/while the WASM runtime boots, a plain JS error,
        an unhandled promise rejection, and the global error bar appearing at all. When Blazor is the thing that
        broke, .NET-side reporting is exactly what you can't rely on — so this path is deliberately dependency-free
        and posts straight to the API with fetch.
        Scrubbing still happens server-side (ErrorScrubber runs on every report regardless of sender), so a raw
        browser message can't put user data in our logs.
    -->
    <script>
        (function () {
            var sent = 0, seen = {};
            function report(kind, message, stack) {
                try {
                    if (sent >= 10 || !message) return;          // a loop must not become a flood
                    var key = kind + '|' + message;
                    if (seen[key]) return;                        // one bug, one report
                    seen[key] = true; sent++;
                    fetch('/client-errors', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            kind: kind,
                            message: String(message).slice(0, 800),
                            stack: stack ? String(stack).slice(0, 4000) : null,
                            where: location.pathname,
                            appVersion: 'js',
                            userAgent: navigator.userAgent
                        }),
                        keepalive: true                           // still sends if the page is being torn down
                    }).catch(function () { });
                } catch (e) { /* a reporter that throws is worse than one that stays quiet */ }
            }

            window.addEventListener('error', function (e) {
                report('js', e.message, e.error && e.error.stack);
            });
            window.addEventListener('unhandledrejection', function (e) {
                var r = e.reason;
                report('js', r && r.message ? r.message : String(r), r && r.stack);
            });

            // The global error bar becoming visible is itself the signal: it means something went unhandled even
            // if we never saw the exception. BUG-2 in BETA-FINDINGS was reported purely as "this bar is showing".
            document.addEventListener('DOMContentLoaded', function () {
                var bar = document.getElementById('blazor-error-ui');
                if (!bar || !window.MutationObserver) return;
                new MutationObserver(function () {
                    if (bar.style.display && bar.style.display !== 'none')
                        report('errorui', 'The global error bar was shown', null);
                }).observe(bar, { attributes: true, attributeFilter: ['style'] });
            });
        })();
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // ⚠️ Registered on `load`, not inline. The published worker precaches the whole runtime on install, and
        // doing that while Blazor is still pulling that same runtime makes a first visit fight itself for the
        // connection. After load the assets are in the HTTP cache, so the precache is mostly 304s.
        // In development this registers the no-op worker — see the comment in service-worker.js.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(() => { /* never block the app over the shell cache */ });
            });
        }
    </script>

</body>

</html>
