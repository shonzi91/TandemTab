<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TandemTab — track together, save together</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css?v=42" />
    <link rel="stylesheet" href="FinApp.App.Web.styles.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script>
        // Apply the saved theme before first paint to avoid a flash. Default is dark (the "Tandem × Midnight"
        // direction) — only an explicit 'light' choice opts out.
        try { if (localStorage.getItem('finapp-theme') !== 'light') document.documentElement.classList.add('dark'); } catch (e) { }
    </script>
</head>

<body>

    <div id="app">
        <div style="display:flex;height:100vh;align-items:center;justify-content:center;font-family:sans-serif;color:#555">Loading…</div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        window.finappNavigate = (url) => { window.location.href = url; };
        window.finappScrollIntoView = (id) => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
        window.finappConfirm = (msg) => { try { return window.confirm(msg); } catch (e) { return true; } };
        window.finappTakeAuthCode = () => {
            try {
                const params = new URLSearchParams(window.location.search);
                const code = params.get('authCode');
                if (code) {
                    params.delete('authCode');
                    const qs = params.toString();
                    history.replaceState(null, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash);
                    return code;
                }
            } catch (e) { }
            return null;
        };
        window.finappTakeResetToken = () => {
            try {
                const params = new URLSearchParams(window.location.search);
                const token = params.get('resetToken');
                if (token) {
                    params.delete('resetToken');
                    const qs = params.toString();
                    history.replaceState(null, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash);
                    return token;
                }
            } catch (e) { }
            return null;
        };
        window.finappGetTheme = () => { try { return localStorage.getItem('finapp-theme') || 'dark'; } catch (e) { return 'dark'; } };
        window.finappSetTheme = (theme) => {
            const dark = theme === 'dark';
            document.documentElement.classList.toggle('dark', dark);
            try { localStorage.setItem('finapp-theme', dark ? 'dark' : 'light'); } catch (e) { }
        };
        window.finappPickImage = () => new Promise(resolve => {
            const input = document.createElement('input');
            input.type = 'file'; input.accept = 'image/*';
            input.onchange = () => {
                const file = input.files && input.files[0];
                if (!file) { resolve(null); return; }
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        const size = 128;
                        const canvas = document.createElement('canvas');
                        canvas.width = size; canvas.height = size;
                        const ctx = canvas.getContext('2d');
                        const scale = Math.max(size / img.width, size / img.height);
                        const w = img.width * scale, h = img.height * scale;
                        ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.85));
                    };
                    img.onerror = () => resolve(null);
                    img.src = reader.result;
                };
                reader.onerror = () => resolve(null);
                reader.readAsDataURL(file);
            };
            input.click();
        });
        // Browser Back integration for the single-page dashboard. The app has one route but many "layers"
        // (open modal, chained sub-modal, a non-Home tab). We mirror that layer depth with synthetic history
        // entries so the hardware/browser Back button pops one layer instead of leaving the app. C# owns the
        // truth: it calls sync(depth) after every render, and we make the history stack match.
        window.finappBack = (function () {
            let dotnet = null, depth = 0, suppress = 0;
            function onpop() {
                if (suppress > 0) { suppress--; return; }   // a self-initiated history.go(), not a user Back
                if (depth > 0) {
                    depth--;                                 // this Back consumed one of our trap entries
                    if (dotnet) dotnet.invokeMethodAsync('OnBrowserBack');
                }
                // depth === 0 → nothing of ours to pop; let the browser navigate away as normal.
            }
            return {
                init(ref) { dotnet = ref; window.removeEventListener('popstate', onpop); window.addEventListener('popstate', onpop); },
                // Make the number of trap entries equal `target` (the app's current layer depth).
                sync(target) {
                    if (target > depth) { for (let i = depth; i < target; i++) history.pushState({ finapp: true }, ''); depth = target; }
                    else if (target < depth) { const d = depth - target; suppress += d; depth = target; history.go(-d); }
                }
            };
        })();
        window.finappDownloadFile = (fileName, base64, contentType) => {
            const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
            const blob = new Blob([bytes], { type: contentType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = fileName;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        };
    </script>
    <!--
        Client error reporting, JS side (OPEN-BETA B1). The .NET reporter covers exceptions inside the app; this
        covers the cases it structurally cannot: a failure before/while the WASM runtime boots, a plain JS error,
        an unhandled promise rejection, and the global error bar appearing at all. When Blazor is the thing that
        broke, .NET-side reporting is exactly what you can't rely on — so this path is deliberately dependency-free
        and posts straight to the API with fetch.
        Scrubbing still happens server-side (ErrorScrubber runs on every report regardless of sender), so a raw
        browser message can't put user data in our logs.
    -->
    <script>
        (function () {
            var sent = 0, seen = {};
            function report(kind, message, stack) {
                try {
                    if (sent >= 10 || !message) return;          // a loop must not become a flood
                    var key = kind + '|' + message;
                    if (seen[key]) return;                        // one bug, one report
                    seen[key] = true; sent++;
                    fetch('/client-errors', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            kind: kind,
                            message: String(message).slice(0, 800),
                            stack: stack ? String(stack).slice(0, 4000) : null,
                            where: location.pathname,
                            appVersion: 'js',
                            userAgent: navigator.userAgent
                        }),
                        keepalive: true                           // still sends if the page is being torn down
                    }).catch(function () { });
                } catch (e) { /* a reporter that throws is worse than one that stays quiet */ }
            }

            window.addEventListener('error', function (e) {
                report('js', e.message, e.error && e.error.stack);
            });
            window.addEventListener('unhandledrejection', function (e) {
                var r = e.reason;
                report('js', r && r.message ? r.message : String(r), r && r.stack);
            });

            // The global error bar becoming visible is itself the signal: it means something went unhandled even
            // if we never saw the exception. BUG-2 in BETA-FINDINGS was reported purely as "this bar is showing".
            document.addEventListener('DOMContentLoaded', function () {
                var bar = document.getElementById('blazor-error-ui');
                if (!bar || !window.MutationObserver) return;
                new MutationObserver(function () {
                    if (bar.style.display && bar.style.display !== 'none')
                        report('errorui', 'The global error bar was shown', null);
                }).observe(bar, { attributes: true, attributeFilter: ['style'] });
            });
        })();
    </script>
    <script src="_framework/blazor.webassembly.js"></script>

</body>

</html>
