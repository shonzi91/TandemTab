<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TandemTab">
    <!-- The TandemTab mark, kept in step with Components/TandemLogo.razor. Colours are literal here: a favicon
         has no CSS custom properties to read, so it always renders the light-theme pair. -->
    <clipPath id="tt-fav"><rect width="64" height="64" rx="17" /></clipPath>
    <g clip-path="url(#tt-fav)">
        <rect width="64" height="64" fill="#13a06e" />
        <path d="M96 -32 L64 0 C62.7 20 52 30.7 32 32 C12 33.3 1.3 44 0 64 L-32 96 L-32 -32 Z" fill="#34d399" />
        <circle cx="20" cy="20" r="8" fill="#0b6b4a" />
        <circle cx="44" cy="44" r="8" fill="#a7f3d0" />
    </g>
</svg>
